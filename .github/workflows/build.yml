name: Build Zygisk Module

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: P0.3.3 Runner Diagnostic
        run: |
          set -e
          echo "PHASE 5 — P0.3.3 WORKFLOW RUNNER ISOLATION"
          echo "STATUS=PASS"
          echo "CHECKPOINT=P0.3.3"
          echo "RUNNER=$RUNNER_OS"
          echo "COMMIT=$GITHUB_SHA"
          echo "RUN_NUMBER=$GITHUB_RUN_NUMBER"

      - name: P0.3.3 Telegram Checkpoint
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 ROOT ASSISTANT CHECKPOINT

            Phase: PHASE 5 — P0 Automation Bridge
            Step: P0.3.3 — Workflow Runner Isolation
            Status: ${{ job.status }}
            Checkpoint: P0.3.3
            Commit: ${{ github.sha }}
            Build Run: #${{ github.run_number }}

            Purpose: RUNNER_DIAGNOSTIC
            Next: CHATGPT_READBACK
