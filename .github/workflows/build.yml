name: Build Zygisk Module

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: P0.4 Runner Sanity Test
        run: |
          set -e
          echo "PHASE 5 — P0 AUTOMATION BRIDGE"
          echo "P0.4 — NDK COMPILE CHECKPOINT"
          echo "RUN NUMBER: $GITHUB_RUN_NUMBER"
          echo "COMMIT: $GITHUB_SHA"
          test -f module.prop
          test -f jni/Android.mk
          test -f jni/Application.mk
          test -f jni/main.cpp
          echo "RESULT: RUNNER SANITY PASS"

      - name: P0.4 Download Android NDK r26b
        run: |
          set -e
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q android-ndk-r26b-linux.zip
          echo "$PWD/android-ndk-r26b" >> "$GITHUB_PATH"
          echo "NDK_ROOT=$PWD/android-ndk-r26b" >> "$GITHUB_ENV"
          echo "NDK SETUP: PASS"

      - name: P0.4 Download Zygisk Header
        run: |
          set -e
          mkdir -p jni
          wget -q https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp -O jni/zygisk.hpp
          test -s jni/zygisk.hpp
          echo "ZYGISK HEADER: PASS"

      - name: P0.4 Compile ARM64
        run: |
          set -e
          cd jni
          ndk-build
          ARTIFACT_PATH="$(find "$GITHUB_WORKSPACE" -type f -name librootassistant.so -size +0c -print -quit)"; test -n "$ARTIFACT_PATH"; test -s "$ARTIFACT_PATH"
          echo "=================================================="
          echo "P0.4 COMPILE: PASS"
          echo "ARTIFACT: jni/libs/arm64-v8a/librootassistant.so"
          ls -lh libs/arm64-v8a/librootassistant.so
          echo "=================================================="

      - name: Telegram Checkpoint
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 ROOT ASSISTANT CHECKPOINT

            Phase: PHASE 5 — P0 Automation Bridge
            Step: P0.4 — NDK Compile Checkpoint

            Status: ${{ job.status }}
            Run: #${{ github.run_number }}
            Commit: ${{ github.sha }}

            Runner: CHECKED
            Repository files: CHECKED

            Next: CHATGPT_READBACK
