name: Build Module

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Zip
        run: |
          rm -f *.zip
          
          # Cari & kumpulkan file utama ke root direktori build
          find . -name "module.prop" -exec cp {} ./ \;
          find . -name "post-fs-data.sh" -exec cp {} ./ \;
          find . -name "service.sh" -exec cp {} ./ \;
          find . -name "sepolicy.rule" -exec cp {} ./ \;
          find . -name "system.prop" -exec cp {} ./ \;
          
          # Jika folder zygisk ada di sub-folder, tarik ke root
          if [ ! -d "zygisk" ]; then
            ZYGISK_PATH=$(find . -type d -name "zygisk" | head -n 1)
            [ -n "$ZYGISK_PATH" ] && cp -r "$ZYGISK_PATH" ./
          fi

          # Buat ZIP secara langsung (flat)
          zip -j Root_Assistant_Stable.zip module.prop post-fs-data.sh
          [ -f service.sh ] && zip -j Root_Assistant_Stable.zip service.sh || true
          [ -f sepolicy.rule ] && zip -j Root_Assistant_Stable.zip sepolicy.rule || true
          [ -f system.prop ] && zip -j Root_Assistant_Stable.zip system.prop || true
          [ -d zygisk ] && zip -r Root_Assistant_Stable.zip zygisk/ || true

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.0
          files: Root_Assistant_Stable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
