name: Build & Auto Release Root Assistant

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto Bump Version & Extract Changelog
        run: |
          git log -1 --pretty=%B > changelog.md
          # Hitung jumlah release tag yang sudah ada untuk increment versi simple (v7.1, v7.2, v7.3...)
          RELEASE_COUNT=$(git tag -l "v7.*" | wc -l)
          NEXT_VER=$((7 + RELEASE_COUNT + 1))
          # Jika belum ada tag sama sekali, mulai dari v7.2
          NEW_VERSION="v7.$((2 + RELEASE_COUNT))"
          NEW_VERSION_CODE=$((7000 + RELEASE_COUNT + 1))
          
          echo "REL_TAG=${NEW_VERSION}" >> $GITHUB_ENV
          
          sed -i "s/^version=.*/version=${NEW_VERSION}/g" module_files/module.prop
          sed -i "s/^versionCode=.*/versionCode=${NEW_VERSION_CODE}/g" module_files/module.prop

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Download Zygisk Header
        run: |
          curl -sL "https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp" -o jni/zygisk.hpp

      - name: Build Zygisk C++ Library
        run: |
          cd jni
          $ANDROID_NDK_HOME/ndk-build APP_BUILD_SCRIPT=Android.mk NDK_PROJECT_PATH=.

      - name: Build Companion APK (Signed Debug)
        run: |
          cd companion_app
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Package Module ZIP
        run: |
          mkdir -p build_out/zygisk
          cp jni/libs/arm64-v8a/libzygisk.so build_out/zygisk/arm64-v8a.so
          cp companion_app/app/build/outputs/apk/debug/*.apk build_out/RootAssistantUI.apk
          cp module_files/* build_out/
          cp changelog.md build_out/
          cd build_out
          zip -r3 ../Root_Assistant_${{ env.REL_TAG }}_Stable.zip .

      - name: Update update.json
        run: |
          VERSION=$(grep "^version=" module_files/module.prop | cut -d= -f2)
          VERSION_CODE=$(grep "^versionCode=" module_files/module.prop | cut -d= -f2)
          
          cat << JSON > update.json
          {
            "version": "$VERSION",
            "versionCode": $VERSION_CODE,
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/${{ env.REL_TAG }}/Root_Assistant_${{ env.REL_TAG }}_Stable.zip",
            "changelog": "https://raw.githubusercontent.com/${{ github.repository }}/main/changelog.md"
          }
          JSON

      - name: Commit Auto-Generated Version & Json Back to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add module_files/module.prop update.json changelog.md
          git diff-index --quiet HEAD || (git commit -m "auto: bump version to ${{ env.REL_TAG }} & update json [skip ci]" && git push)

      - name: Create Clean Release via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.REL_TAG }}" \
            --title "Root Assistant ${{ env.REL_TAG }}" \
            --notes-file changelog.md \
            Root_Assistant_${{ env.REL_TAG }}_Stable.zip
