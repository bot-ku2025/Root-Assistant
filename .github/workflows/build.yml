name: Build Module

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Zip and Package Correctly
        run: |
          rm -f *.zip
          
          # 1. Pastikan folder zygisk dan file .so ada di tempatnya
          rm -rf zygisk
          mkdir -p zygisk
          find . -name "arm64-v8a.so" -exec cp {} zygisk/ \;
          
          # 2. Validasi biner tidak boleh kosong
          if [ ! -f "zygisk/arm64-v8a.so" ]; then
            echo "Error: arm64-v8a.so not found!"
            exit 1
          fi

          # 3. Buat ZIP secara flat root mutlak
          zip -j Root_Assistant_Stable.zip module.prop post-fs-data.sh
          [ -f service.sh ] && zip -j Root_Assistant_Stable.zip service.sh || true
          [ -f sepolicy.rule ] && zip -j Root_Assistant_Stable.zip sepolicy.rule || true
          [ -f system.prop ] && zip -j Root_Assistant_Stable.zip system.prop || true
          zip -r Root_Assistant_Stable.zip zygisk/

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.0
          files: Root_Assistant_Stable.zip
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
