name: Build Zygisk Module

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: P0.4 Runner Sanity Test
        run: |
          set -e
          echo "PHASE 5 — P0 AUTOMATION BRIDGE"
          echo "P0.4 — NDK COMPILE CHECKPOINT"
          echo "RUN NUMBER: $GITHUB_RUN_NUMBER"
          echo "COMMIT: $GITHUB_SHA"
          test -f module.prop
          test -f jni/Android.mk
          test -f jni/Application.mk
          test -f jni/main.cpp
          echo "RESULT: RUNNER SANITY PASS"

      - name: P0.4 Download Android NDK r26b
        run: |
          set -e
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q android-ndk-r26b-linux.zip
          echo "$PWD/android-ndk-r26b" >> "$GITHUB_PATH"
          echo "NDK_ROOT=$PWD/android-ndk-r26b" >> "$GITHUB_ENV"
          echo "NDK SETUP: PASS"

      - name: P0.4 Download Zygisk Header
        run: |
          set -e
          mkdir -p jni
          wget -q https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp -O jni/zygisk.hpp
          test -s jni/zygisk.hpp
          echo "ZYGISK HEADER: PASS"

      - name: P0.4 Compile ARM64
        run: |
          set -e
          cd jni
          ndk-build
          ARTIFACT_PATH="$(find "$GITHUB_WORKSPACE" -type f -name librootassistant.so -size +0c -print -quit)"; test -n "$ARTIFACT_PATH"; test -s "$ARTIFACT_PATH"
          echo "=================================================="
          echo "P0.4 COMPILE: PASS"
          echo "ARTIFACT: jni/libs/arm64-v8a/librootassistant.so"
          ls -lh "$ARTIFACT_PATH"
          echo "=================================================="

      - name: P0.5 Package ZIP Integrity
        run: |
          set -e
          echo "=================================================="
          echo "PHASE 5 — P0 AUTOMATION BRIDGE"
          echo "P0.5 — PACKAGE/ZIP INTEGRITY CHECKPOINT"
          echo "RUN NUMBER: $GITHUB_RUN_NUMBER"
          echo "COMMIT: $GITHUB_SHA"
          echo "=================================================="
          ARTIFACT_PATH="$(find "$GITHUB_WORKSPACE" -type f -name librootassistant.so -size +0c -print -quit)"
          test -n "$ARTIFACT_PATH"
          test -s "$ARTIFACT_PATH"
          mkdir -p "$GITHUB_WORKSPACE/zygisk"
          cp "$ARTIFACT_PATH" "$GITHUB_WORKSPACE/zygisk/arm64-v8a.so"
          test -s "$GITHUB_WORKSPACE/zygisk/arm64-v8a.so"
          ZIP_NAME="Root-Assistant-PHASE5-P0.5.zip"
          rm -f "$GITHUB_WORKSPACE/$ZIP_NAME"
          cd "$GITHUB_WORKSPACE"
          zip -q -r "$ZIP_NAME" module.prop post-fs-data.sh service.sh sepolicy.rule zygisk/
          test -s "$GITHUB_WORKSPACE/$ZIP_NAME"
          unzip -tq "$GITHUB_WORKSPACE/$ZIP_NAME"
          echo "ZIP CONTENT:"
          unzip -l "$GITHUB_WORKSPACE/$ZIP_NAME"
          ZIP_SIZE="$(stat -c%s "$GITHUB_WORKSPACE/$ZIP_NAME")"
          ZIP_SHA256="$(sha256sum "$GITHUB_WORKSPACE/$ZIP_NAME" | awk "{print \$1}")"
          test "$ZIP_SIZE" -gt 0
          echo "=================================================="
          echo "P0.5 PACKAGE: PASS"
          echo "ZIP: $ZIP_NAME"
          echo "SIZE: $ZIP_SIZE bytes"
          echo "SHA256: $ZIP_SHA256"
          echo "ZIP INTEGRITY: PASS"
          echo "=================================================="

      - name: P0.6 Upload ZIP Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Root-Assistant-PHASE5-P0.5
          path: Root-Assistant-PHASE5-P0.5.zip
          if-no-files-found: error
          retention-days: 7

      - name: P0.7 Telegram ZIP Delivery
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          document: Root-Assistant-PHASE5-P0.5.zip
          message: |
            📦 ROOT ASSISTANT ZIP DELIVERY

            Phase: PHASE 5 — P0 Automation Bridge
            Step: P0.7 — Telegram ZIP Delivery

            Status: ${{ job.status }}
            Run: #${{ github.run_number }}
            Commit: ${{ github.sha }}

            ZIP: Root-Assistant-PHASE5-P0.5.zip
            ZIP Integrity: VERIFIED
            GitHub Artifact: VERIFIED

            Next: CHATGPT_READBACK

      - name: Telegram Checkpoint
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 ROOT ASSISTANT CHECKPOINT

            Phase: PHASE 5 — P0 Automation Bridge
            Step: P0.7 — Telegram ZIP Delivery Checkpoint

            Status: ${{ job.status }}
            Run: #${{ github.run_number }}
            Commit: ${{ github.sha }}

            Runner: CHECKED
            Repository files: CHECKED

            Next: CHATGPT_READBACK
