name: Build Module

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Flat ZIP with Repo Binary
        run: |
          rm -f *.zip
          
          # Buat folder zygisk bersih
          rm -rf zygisk
          mkdir -p zygisk
          
          # Cari otomatis file arm64-v8a.so di manapun letaknya di dalam repo Anda
          FOUND_SO=$(find . -name "arm64-v8a.so" | head -n 1)
          
          if [ -n "$FOUND_SO" ]; then
            echo "Found binary at: $FOUND_SO"
            cp "$FOUND_SO" zygisk/arm64-v8a.so
          else
            echo "Error: Biner arm64-v8a.so tidak ditemukan di dalam repo!"
            exit 1
          fi

          # Kompres ZIP secara flat root mutlak (tanpa folder pembungkus)
          zip -j Root_Assistant_Stable.zip module.prop post-fs-data.sh
          [ -f service.sh ] && zip -j Root_Assistant_Stable.zip service.sh || true
          [ -f sepolicy.rule ] && zip -j Root_Assistant_Stable.zip sepolicy.rule || true
          [ -f system.prop ] && zip -j Root_Assistant_Stable.zip system.prop || true
          zip -r Root_Assistant_Stable.zip zygisk/

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.0
          files: Root_Assistant_Stable.zip
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
