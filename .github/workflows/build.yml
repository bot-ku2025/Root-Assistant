name: Build Hybrid Module

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Native Zygisk Binary
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q android-ndk-r26b-linux.zip
          export ANDROID_NDK_HOME=$PWD/android-ndk-r26b

          if [ -d "jni" ] && [ "$(ls -A jni)" ]; then
            cd jni
            $ANDROID_NDK_HOME/ndk-build
            cd ..
          fi

      - name: Assemble Flat ZIP Direct from Root
        run: |
          rm -f *.zip
          rm -rf build_staging
          mkdir -p build_staging/zygisk

          # Ambil hasil kompilasi biner .so jika ada
          SO_FILE=$(find libs/ obj/ jni/ -name "*.so" 2>/dev/null | head -n 1)
          if [ -n "$SO_FILE" ]; then
            cp -f "$SO_FILE" build_staging/zygisk/arm64-v8a.so
          fi

          # Salin berkas modul dari root repositori ke staging
          [ -f module.prop ] && cp -f module.prop build_staging/
          [ -f post-fs-data.sh ] && cp -f post-fs-data.sh build_staging/
          [ -f service.sh ] && cp -f service.sh build_staging/
          [ -f sepolicy.rule ] && cp -f sepolicy.rule build_staging/
          [ -f system.prop ] && cp -f system.prop build_staging/
          [ -f customize.sh ] && cp -f customize.sh build_staging/

          # Kompresi struktur flat root
          cd build_staging
          zip -r ../Root_Assistant_Stable.zip .
          cd ..

      - name: Upload Release Artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.0
          files: Root_Assistant_Stable.zip
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
