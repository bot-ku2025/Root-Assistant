name: Build Hybrid Module

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Native Zygisk Binary with Manual NDK
        run: |
          # Unduh dan setup Android NDK secara mandiri di runner
          echo "Downloading Android NDK r26b..."
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q android-ndk-r26b-linux.zip
          export ANDROID_NDK_HOME=$PWD/android-ndk-r26b

          # Kompilasi C++ Zygisk
          cd jni
          $ANDROID_NDK_HOME/ndk-build
          cd ..

      - name: Assemble and Package Flat Hybrid ZIP
        run: |
          rm -f *.zip
          
          # Buat direktori staging bersih untuk struktur flat root
          rm -rf build_staging
          mkdir -p build_staging/zygisk
          
          # 1. Ambil file modul utama dari folder module_files/
          if [ -d "module_files" ]; then
            cp -rf module_files/* build_staging/
          fi
          
          # 2. Timpa/lengkapi dengan file root jika ada
          [ -f module.prop ] && cp -f module.prop build_staging/
          [ -f post-fs-data.sh ] && cp -f post-fs-data.sh build_staging/
          [ -f service.sh ] && cp -f service.sh build_staging/
          [ -f sepolicy.rule ] && cp -f sepolicy.rule build_staging/
          [ -f system.prop ] && cp -f system.prop build_staging/

          # 3. Ambil hasil kompilasi biner .so dan letakkan ke folder zygisk/
          if [ -f "libs/arm64-v8a/arm64-v8a.so" ]; then
            cp -f libs/arm64-v8a/arm64-v8a.so build_staging/zygisk/
          elif [ -f "obj/local/arm64-v8a/arm64-v8a.so" ]; then
            cp -f obj/local/arm64-v8a/arm64-v8a.so build_staging/zygisk/
          fi

          # 4. Validasi mutlak keberadaan biner .so
          if [ ! -f "build_staging/zygisk/arm64-v8a.so" ]; then
            echo "CRITICAL ERROR: Biner arm64-v8a.so gagal dikompilasi!"
            exit 1
          fi

          # 5. Kompres ZIP secara flat absolute
          cd build_staging
          zip -r ../Root_Assistant_Stable.zip .
          cd ..
          
          echo "Build finished successfully: Root_Assistant_Stable.zip created."

      - name: Upload Release Artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.0
          files: Root_Assistant_Stable.zip
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
