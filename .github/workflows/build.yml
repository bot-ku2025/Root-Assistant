name: Build Module

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Zip
        run: |
          rm -f *.zip
          zip -j Root_Assistant_Stable.zip module.prop post-fs-data.sh service.sh sepolicy.rule system.prop
          zip -r Root_Assistant_Stable.zip zygisk/
          
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.0
          files: Root_Assistant_Stable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
