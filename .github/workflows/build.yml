name: Build Zygisk Module

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: P0.3.9 Runner Test
        run: |
          set -e
          echo "PHASE 5 — P0 AUTOMATION BRIDGE"
          echo "P0.3.9 — MINIMAL WORKFLOW PARSER TEST"
          echo "RUN NUMBER: $GITHUB_RUN_NUMBER"
          echo "COMMIT: $GITHUB_SHA"
          test -f module.prop
          test -f jni/Android.mk
          test -f jni/Application.mk
          test -f jni/main.cpp
          echo "RESULT: P0.3.9 RUNNER PASS"

      - name: Telegram Checkpoint
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 ROOT ASSISTANT CHECKPOINT

            Phase: PHASE 5 — P0 Automation Bridge
            Step: P0.3.9 — Minimal Workflow Parser Test

            Status: ${{ job.status }}
            Run: #${{ github.run_number }}
            Commit: ${{ github.sha }}

            Runner: CHECKED
            Repository files: CHECKED

            Next: CHATGPT_READBACK
