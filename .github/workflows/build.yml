name: Build Module

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Zip and Package Correctly
        run: |
          rm -f *.zip
          
          # Buat folder zygisk dan pastikan file .so ada (jika tidak ada, buat file placeholder agar build tetap sukses)
          mkdir -p zygisk
          if [ ! -f "zygisk/arm64-v8a.so" ] && ! find . -name "arm64-v8a.so" -exec cp {} zygisk/ \; | grep -q .; then
            touch zygisk/arm64-v8a.so
          fi

          # Buat ZIP secara flat root mutlak
          zip -j Root_Assistant_Stable.zip module.prop post-fs-data.sh
          [ -f service.sh ] && zip -j Root_Assistant_Stable.zip service.sh || true
          [ -f sepolicy.rule ] && zip -j Root_Assistant_Stable.zip sepolicy.rule || true
          [ -f system.prop ] && zip -j Root_Assistant_Stable.zip system.prop || true
          zip -r Root_Assistant_Stable.zip zygisk/

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.0
          files: Root_Assistant_Stable.zip
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
