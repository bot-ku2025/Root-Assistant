name: Build Root Assistant Enterprise

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nbmdf/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Build Zygisk C++ Library
        run: |
          cd jni
          $ANDROID_NDK_HOME/ndk-build APP_BUILD_SCRIPT=Android.mk NDK_PROJECT_PATH=.

      - name: Build Companion APK
        run: |
          cd companion_app
          chmod +x gradlew || gradle wrapper
          gradle assembleRelease || ./gradlew assembleRelease

      - name: Package Module ZIP
        run: |
          mkdir -p build_out/zygisk
          cp jni/libs/arm64-v8a/libzygisk.so build_out/zygisk/arm64-v8a.so
          cp companion_app/app/build/outputs/apk/release/*.apk build_out/RootAssistantUI.apk
          cp module_files/* build_out/
          cd build_out
          zip -r3 ../Root_Assistant_v7.2_Stable.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Root_Assistant_v7.2_Stable
          path: Root_Assistant_v7.2_Stable.zip
