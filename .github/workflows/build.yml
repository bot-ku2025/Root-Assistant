name: Build Zygisk Module
on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download & Setup Android NDK Directly
        run: |
          echo "Downloading Android NDK r26b..."
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          echo "Extracting NDK..."
          unzip -q android-ndk-r26b-linux.zip
          echo "NDK_ROOT=$PWD/android-ndk-r26b" >> $GITHUB_ENV
          echo "$PWD/android-ndk-r26b" >> $GITHUB_PATH

      - name: Download Zygisk API Header
        run: |
          mkdir -p jni
          wget -q https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp -O jni/zygisk.hpp

      - name: Capture Git Info & Sanitize Version
        run: |
          echo "COMMIT_MSG=$(git log -1 --pretty=%B)" >> $GITHUB_ENV
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "BUILD_TIME=$(TZ=Asia/Jakarta date '+%H:%M:%S')" >> $GITHUB_ENV
          echo "RA_PHASE=PHASE 5 — P1 Foundation" >> $GITHUB_ENV
          echo "RA_STEP=P1.1 — Build ZIP Integrity Checkpoint" >> $GITHUB_ENV
          if [ -f module.prop ]; then
            RAW_VERSION=$(grep '^version=' module.prop | cut -d'=' -f2 | tr -d '\r')
            CLEAN_VERSION=$(echo "$RAW_VERSION" | tr ' ' '-' | sed 's/[^a-zA-Z0-9._-]/-/g')
            echo "VERSION_TAG=${CLEAN_VERSION:-v3.0-Ultimate}" >> $GITHUB_ENV
          else
            echo "VERSION_TAG=v3.0-Ultimate" >> $GITHUB_ENV
          fi

      - name: Build with NDK & Capture Error Log
        id: compile
        continue-on-error: true
        run: |
          cd jni
          ndk-build 2> build_error.log
          cat build_error.log

      - name: Check Build Status
        id: check_status
        run: |
          if [ -s jni/build_error.log ] && grep -qiE "fatal error:|error:|undefined reference|no such file|permission denied|failed|failure" jni/build_error.log; then
            echo "build_status=FAILURE" >> $GITHUB_ENV
            ROOT_ERROR=$(grep -iE "fatal error:|error:|undefined reference|no such file|permission denied|failed|failure" jni/build_error.log | head -n 1)
            ROOT_ERROR=$(echo "$ROOT_ERROR" | cut -c1-500)
            if echo "$ROOT_ERROR" | grep -qi "fatal error:"; then
              ERROR_POINT="Compile"
              ERROR_DETAIL="Kegagalan utama terdeteksi pada compiler C/C++."
            elif echo "$ROOT_ERROR" | grep -qi "undefined reference"; then
              ERROR_POINT="Linking"
              ERROR_DETAIL="Symbol atau function yang dibutuhkan tidak ditemukan saat linking."
            elif echo "$ROOT_ERROR" | grep -qiE "no such file|cannot find"; then
              ERROR_POINT="Compile"
              ERROR_DETAIL="File atau dependency yang dibutuhkan tidak ditemukan."
            elif echo "$ROOT_ERROR" | grep -qi "permission denied"; then
              ERROR_POINT="Build"
              ERROR_DETAIL="Proses build tidak memiliki akses yang diperlukan."
            else
              ERROR_POINT="Compile"
              ERROR_DETAIL="Error utama terdeteksi dari output build."
            fi
            echo "error_point=$ERROR_POINT" >> $GITHUB_ENV
            echo "error_detail=$ERROR_DETAIL" >> $GITHUB_ENV
            echo "root_cause=$ROOT_ERROR" >> $GITHUB_ENV
            exit 1
          else
            echo "build_status=SUCCESS" >> $GITHUB_ENV
          fi

      - name: Package Module (Zygisk Standard Structure)
        if: env.build_status == 'SUCCESS'
        run: |
          mkdir -p build_output
          mkdir -p zygisk
          
          # Pindahkan dan sesuaikan nama .so agar terbaca oleh Zygisk daemon
          if [ -f obj/local/arm64-v8a/librootassistant.so ]; then
            cp obj/local/arm64-v8a/librootassistant.so zygisk/arm64-v8a.so
          elif [ -f libs/arm64-v8a/*.so ]; then
            cp libs/arm64-v8a/*.so zygisk/arm64-v8a.so
          fi
          
          ZIP_NAME="Root-Assistant-PHASE5-P1.1.zip"
          # Bungkus dengan folder 'zygisk/' wajib standar Topjohnwu
          zip -r "build_output/$ZIP_NAME" module.prop service.sh sepolicy.rule zygisk/
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV


      - name: Verify ZIP Integrity
        if: env.build_status == 'SUCCESS'
        run: |
          set -e

          ZIP="build_output/${ZIP_NAME}"

          test -s "$ZIP"
          unzip -tq "$ZIP"

          unzip -l "$ZIP" | grep -q "module.prop"
          unzip -l "$ZIP" | grep -q "service.sh"
          unzip -l "$ZIP" | grep -q "sepolicy.rule"
          unzip -l "$ZIP" | grep -q "zygisk/arm64-v8a.so"

          test -s zygisk/arm64-v8a.so

          SHA256=$(sha256sum "$ZIP" | cut -d' ' -f1)
          ZIP_SIZE=$(stat -c%s "$ZIP")

          echo "ZIP_SHA256=$SHA256" >> $GITHUB_ENV
          echo "ZIP_SIZE=$ZIP_SIZE" >> $GITHUB_ENV

      - name: Send Telegram Notification (Success)
        if: env.build_status == 'SUCCESS'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          message: |
            🚀 ROOT ASSISTANT DEVELOPMENT UPDATE

            📍 Phase: ${{ env.RA_PHASE }}
            🔧 Step: ${{ env.RA_STEP }}

            Status: ✅ PASS — Build & ZIP Checkpoint

            📦 File: Root-Assistant-​PHASE5-P1.1
            🛠️ Build Run: Build Hybrid Module #${{ github.run_number }}
            📌 Commit: `${{ env.COMMIT_SHA }}`
            📌 Topik Update: ${{ env.COMMIT_MSG }}

            📊 Result:
            • Compile: ✅ PASS
            • Package: ✅ PASS
            • ZIP Integrity: ✅ PASS
            • Existing Infrastructure: ✅ Preserved

            ⏰ Waktu Selesai: ${{ env.BUILD_TIME }} WIB

            📝 SUMMARY

            🔐 Checkpoint: P1.1 Build & ZIP Integrity

            🛡️ Infrastructure:
            Existing infrastructure tetap dipertahankan.

      - name: Send Telegram Notification (Failure with Error Log)
        if: always() && (env.build_status == FAILURE || failure())
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚨 ROOT ASSISTANT DEVELOPMENT UPDATE

            📍 Phase: ${{ env.RA_PHASE }}
            🔧 Step: ${{ env.RA_STEP }}

            Status: ❌ FAIL — Build & ZIP Checkpoint

            📦 File: Root-Assistant-PHASE5-P1.1
            🛠️ Build Run: Build Hybrid Module #${{ github.run_number }}
            📌 Commit: `${{ env.COMMIT_SHA }}`
            📌 Topik Update: ${{ env.COMMIT_MSG }}

            📊 Result:
            • Compile: ❌ FAILED
            • Package: ⏭️ NOT RUN
            • ZIP Integrity: ⏭️ NOT RUN
            • Existing Infrastructure: ✅ Preserved

            ⏰ Waktu Gagal: ${{ env.BUILD_TIME }} WIB

            🎯 ANALISA ERROR UTAMA

            ❌ Titik gagal: ${{ env.error_point }}

            🔎 Root Cause:
            `${{ env.root_cause }}`

            📍 Detail:
            ${{ env.error_detail }}

            🎯 Error terpusat:
            Error utama dipilih dari kandidat error paling awal dan paling relevan pada log build.

            📝 SUMMARY

            🔐 Checkpoint: P1.1 Build & ZIP Integrity

            🛡️ Infrastructure:
            Existing infrastructure tetap dipertahankan.

