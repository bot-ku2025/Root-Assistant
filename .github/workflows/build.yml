name: Build Module

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Zip
        run: |
          rm -f *.zip
          # Buat struktur zip flat dengan mengecek ketersediaan file
          [ -f module.prop ] && zip Root_Assistant_Stable.zip module.prop
          [ -f post-fs-data.sh ] && zip Root_Assistant_Stable.zip post-fs-data.sh
          [ -f service.sh ] && zip Root_Assistant_Stable.zip service.sh
          [ -f sepolicy.rule ] && zip Root_Assistant_Stable.zip sepolicy.rule
          [ -f system.prop ] && zip Root_Assistant_Stable.zip system.prop
          [ -d zygisk ] && zip -r Root_Assistant_Stable.zip zygisk/
          
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.0
          files: Root_Assistant_Stable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
